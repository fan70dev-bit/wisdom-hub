# application.yml
server:
  port: 8080

spring:
  application:
    name: wisdom-hub
  profiles:
    active: dev

wisdomhub:
  agent:
    ai:
      enabled: false
      default-provider: deepseek
      openai:
        enabled: false
        model: gpt-4.1-mini
      deepseek:
        enabled: false
        model: deepseek-chat
      ollama:
        enabled: false
        model: qwen2.5:7b


logging:
  level:
    com.wisdomhub: DEBUG
    org.springframework.mail: DEBUG
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n'
